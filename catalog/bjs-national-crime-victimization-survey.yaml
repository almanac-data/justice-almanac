notes: |
  Human-verified 2026-10-31: HTTP 200. The page calls the NCVS "the nation's primary source of information on criminal victimization", with a yearly sample of "about 240,000 persons in about 150,000 households", and gives the collection period as 1973 – 2024. Public-use microdata is usually archived at ICPSR's National Archive of Criminal Justice Data (NACJD), which returned 403 to curl this session and was not checked. BJS's own data tools publish aggregate tables. The csv format is assumed, not checked.
