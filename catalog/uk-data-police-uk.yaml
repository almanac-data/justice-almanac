notes: |
  Human-verified 2026-10-31: HTTP 200. The site calls itself "the site for open data about crime and policing in England, Wales and Northern Ireland", with street-level crime, outcome, and stop-and-search downloads in CSV and an API. It states "All the data on this site is made available under the Open Government Licence v3.0". Several things come from the site's usual description and were not checked here: that the Home Office is the publisher, the monthly cadence, the rolling archive span, and json from the API.
