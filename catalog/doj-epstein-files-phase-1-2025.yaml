title: 'DOJ: First Phase of Declassified Epstein Files (27 February 2025)'
description: |
  The Department of Justice and FBI's February 2025 release of the "first phase" of declassified Epstein files: an evidence list, flight logs previously released in U.S. v. Maxwell, and two redacted documents. DOJ said this material "largely contains documents that have been previously leaked but never released in a formal capacity by the U.S. Government".
