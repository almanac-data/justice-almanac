notes: |
  Human-verified 2026-10-31: HTTP 200 application/pdf, 289,140 bytes, Last-Modified "Thu, 12 Nov 2020" (headless Chromium session; justice.gov serves curl a bot-check page). The old /download URL redirects to /dl?inline=. The PDF is 13 pages, headed "EXECUTIVE SUMMARY OF REPORT ... Investigation into the U.S. Attorney's Office for the Southern District of Florida's Resolution of Its 2006-2008 Federal Criminal Investigation of Jeffrey Epstein and Its Interactions with Victims during the Investigation ... November 2020".
  Release: 12 Nov 2020. DOJ's statement of that date (https://www.justice.gov/archives/opa/pr/statement-doj-office-professional-responsibility-report-jeffrey-epstein-2006-2008, press release 20-1227, "Updated February 5, 2025") says the executive summary "was released today to affected victims" and is on the DOJ website. It adds: "The Privacy Act prohibits the Department from releasing the full report publicly, but permits the report to be disclosed upon request to a congressional committee". So only the summary is public, and the full report is not cataloged.
  Status: live, not frozen. The release is a one-off dated document, but neither the PDF nor DOJ's statement calls it "final" or "complete".
  Redaction: the summary names the then-U.S. Attorney, but no victims. No separate redaction statement is shown. Court-filed copies of OPR material also appear in DOJ's Epstein Library under United States v. Maxwell, No. 1:20-cr-00330; those were not checked.
  Licence checked 2026-10-31: DOJ-authored, and https://www.justice.gov/legalpolicies says "Unless otherwise indicated, information on Department of Justice websites is in the public domain". High confidence.
