notes: |
  Human-verified 2026-10-31: HTTP 200 (headless Chromium; curl with a browser User-Agent gets HTTP 403, so reachability.headless is needed). The collection page "Jeffrey Epstein" lists "Jeffrey Epstein Part 01" through "Jeffrey Epstein Part 22 (Final)" and is "Filed under: Frequently Requested". Part 01 is "PDF document, 2600 kB", 44 pages. The "(Final)" label is on the last part only, and the Vault doesn't describe the collection as complete, so status is live, not frozen.
  Authority: FOIA. The Vault describes itself as the FBI's FOIA Library and links to "Explanation of FOI/PA Exemptions". The Vault disclaimer says some older files "may contain processing procedures that are not compliant with current FOIA processing standards". Redactions are FOIA/Privacy Act exemptions applied per page. No collection-specific redaction statement is shown.
  Release date and "last updated": not shown on the collection page, and not verified. A second, separate Vault collection exists: see fbi-vault-epstein-investigative-holdings-review. DOJ's Epstein Library also lists an FBI FOIA set (https://www.justice.gov/epstein/doj-disclosures/foia-federal-bureau-investigation-fbi). Whether that set is the same material was not checked.
  Licence checked 2026-10-31: the FBI legal-notices page (https://www.fbi.gov/legalnotices) loaded, but no copyright sentence could be extracted from it. The public-domain claim rests on 17 U.S.C. 105 for records the FBI itself created, which is medium confidence. Documents in the files authored by others are not US Gov works. Not checked: file contents and total page count.
