title: U.S. Department of Justice Epstein Library
description: |
  The Department of Justice's public library of Epstein-related records, published under the Epstein Files Transparency Act (Pub. L. 119-38). It is the landing page and full-text search for DOJ's disclosures, and it links to the House Oversight Committee's disclosures.
