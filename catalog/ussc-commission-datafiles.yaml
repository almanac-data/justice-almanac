notes: |
  Human-verified 2026-10-31: HTTP 200. The page describes the datafiles as excluding identifiers and providing "fiscal year data for researchers interested in studying federal sentencing practices". It lists Individuals, Organizations, Special Collections, and Special Reports datafiles, and says they are also distributed through ICPSR. The SAS/SPSS formats come from the Commission's usual distribution and were not checked file by file. The USSC is an independent agency in the judicial branch.
