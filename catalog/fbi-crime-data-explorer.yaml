notes: |
  Human-verified 2026-10-31: HTTP 200; the root redirects to /LATEST/webapp/#/pages/home and only renders with JavaScript. In headless Chromium, the Documents & Downloads page offers CSV downloads ("Incident-based data by state, summary data estimates, and data about other specific topics") and says "Data are also available via the Crime Data API". It notes the UCR Program provided updated 2025 data in August 2026. The API's auth terms were not confirmed. Agency participation in NIBRS varies by year, so coverage is uneven; that comes from FBI's own documentation and is not stated on the pages checked.
