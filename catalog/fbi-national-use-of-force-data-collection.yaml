notes: |
  Human-verified 2026-11-01: HTTP 200 (plain curl on the Crime Data Explorer; the page is a JavaScript app, so its content was read in headless Chromium). The address is a client-side route of the explorer, so a link check only sees https://cde.ucr.cjis.gov/; see also fbi-crime-data-explorer. The page says: "In 2026, 11,894 out of 19,671 federal, state, local, and tribal law enforcement agencies throughout the nation participated and provided use-of-force data. The officers employed by these agencies represent 75% of federal, state, local, and tribal sworn officers in the nation", with "Data as of: 10/14/2026". It ranks the most frequent types of force used and resistance encountered, offers downloadable lists of participating agencies, and states: "The collection officially began accepting data on January 1, 2019." It also says the program "does not assess whether the officers involved in use-of-force incidents acted within the bounds of their respective departmental policies", and has sections "Data Considerations" and "Avoid Ranking and Comparisons". The CDE Documents & Downloads page lists no use-of-force bulk file, so the only downloads seen are the participation lists; their CSV format is assumed and was not checked. Earlier years and the FBI's publication thresholds were not checked. The FBI's program page (https://www.fbi.gov/useofforce, which redirects to /how-we-can-help-you/more-fbi-services-and-information/ucr/use-of-force) returned a Cloudflare 403 to curl and headless Chromium.
  Licence checked 2026-11-01: no licence statement was found on the CDE pages read (home, use-of-force, Documents & Downloads), and www.fbi.gov's policy pages were behind Cloudflare. public-domain is asserted from the FBI's status as a federal agency (17 U.S.C. 105), not from an FBI statement. The underlying reports are submitted by state, local and tribal agencies to a federal collection.
