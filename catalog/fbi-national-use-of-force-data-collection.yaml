id: fbi-national-use-of-force-data-collection
type: dataset
title: FBI National Use-of-Force Data Collection
description: |
  The FBI's national collection of law enforcement use-of-force incidents, accepting data since 1 January 2019 and published through the Crime Data Explorer as participation counts and aggregate statistics on incidents, subjects and officers. Participation is voluntary and uneven, which the FBI reports alongside the data.
