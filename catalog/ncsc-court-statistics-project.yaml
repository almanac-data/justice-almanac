notes: |
  Human-verified 2026-11-01: HTTP 200 (curl with a browser User-Agent and headless Chromium). The issue's URL, https://www.courtstatistics.org/, answers HTTP 302 to https://www.ncsc.org/resources-courts/data, a general NCSC data page ("70M 2024 state court filings", "4% change from 2023"); this entry uses the page that page links as "Explore caseload data", which holds the dashboards themselves. That page says: "We aggregate annual caseload data from states to create this one-of-a-kind resource for understanding the trends shaping our judiciary system", and links Tableau dashboards on tableau.ncsc.org for trial courts (overview, civil, criminal, domestic relations, juvenile, traffic) and appellate courts, built on the State Court Guide to Statistical Reporting. The Court Statistics Project page (https://www.ncsc.org/our-centers-projects/court-statistics-project) calls CSP "a collaborative initiative of NCSC and the Conference of State Court Administrators (COSCA)" that "collects, analyzes, and publishes caseload data from state courts". NCSC is an independent non-profit, not a government body, so jurisdiction.scope national is used loosely. I did not open the Tableau dashboards or check whether they allow data export, and I found no bulk download.
  Licence checked 2026-11-01: not verified. I found no terms-of-use page (www.ncsc.org/terms-of-use, /terms-and-conditions, /terms and /copyright all return 404), and the privacy policy and CSP page carry only the footer "Copyright © 2026 National Center for State Courts". That is a site-wide copyright notice, not a data licence, so no reuse terms are asserted. The underlying figures are reported by state courts.
