id: ncsc-court-statistics-project
type: dataset
title: NCSC Court Statistics Project (state court caseloads)
description: |
  Annual, comparable caseload statistics for US state trial and appellate courts (civil, criminal, domestic relations, juvenile and traffic filings, pending and disposed cases), aggregated from data that state courts submit. It is the standard source for state courts, where most US cases are heard.
publisher: National Center for State Courts (NCSC), with the Conference of State Court Administrators (COSCA)
